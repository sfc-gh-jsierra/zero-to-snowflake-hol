<!-- PLANTILLA BASE COMPARTIDA DEL HOL ZERO TO SNOWFLAKE -->
<!-- Uso: copia el bloque <style> completo y el bloque <script> completo, verbatim, en cada lab. -->
<!-- Cero dependencias externas: sin Google Fonts, sin CDN, sin logos remotos. -->

<style>

:root {
    --sf-accent: #29B5E8;
    --sf-headers: #11567F;
    --sf-headers-dark: #0c3f5c;
    --sf-green: #2fb380;
    --sf-red: #e5484d;
    --sf-orange: #ff922b;
    --sf-yellow: #ffb703;

    --gray-50: #f8fafc;
    --gray-100: #f1f5f9;
    --gray-200: #e2e8f0;
    --gray-300: #cbd5e1;
    --gray-400: #94a3b8;
    --gray-500: #64748b;
    --gray-600: #475569;
    --gray-700: #334155;
    --gray-800: #1e293b;
    --gray-900: #0f172a;

    --font-head: 'Montserrat', 'Segoe UI', Arial, sans-serif;
    --font-body: 'Lato', 'Segoe UI', Helvetica, Arial, sans-serif;
    --font-mono: 'SFMono-Regular', 'Consolas', 'Menlo', monospace;

    --space-xs: 0.25rem;
    --space-sm: 0.5rem;
    --space-md: 1rem;
    --space-lg: 1.5rem;
    --space-xl: 2rem;
    --space-2xl: 3rem;
    --space-3xl: 4rem;

    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-full: 9999px;

    --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 10px -2px rgba(17,86,127,0.15);
    --shadow-lg: 0 10px 20px -4px rgba(17,86,127,0.20);

    --header-height: 64px;
    --sidebar-width: 270px;
    --content-max-width: 880px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-height) + var(--space-lg)); }
body {
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.65;
    color: var(--gray-800);
    background-color: var(--gray-50);
    -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 {
    font-family: var(--font-head);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--gray-900);
}
a { color: var(--sf-accent); text-decoration: none; }
a:hover { color: var(--sf-headers); }
code { font-family: var(--font-mono); }

/* Header */
.hol-header {
    position: fixed; top: 0; left: 0; right: 0; height: var(--header-height);
    background: white; border-bottom: 1px solid var(--gray-200); z-index: 100; box-shadow: var(--shadow-sm);
}
.header-container {
    max-width: 1400px; margin: 0 auto; height: 100%;
    display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-xl);
}
.logo-section { display: flex; align-items: center; gap: var(--space-md); }
.sf-logo-mark { width: 32px; height: 32px; }
.brand-name { font-family: var(--font-head); font-weight: 700; font-size: 1rem; color: var(--sf-headers); letter-spacing: 0.5px; }
.logo-divider { width: 1px; height: 24px; background: var(--gray-300); }
.hol-badge {
    background: linear-gradient(135deg, var(--sf-accent), var(--sf-headers));
    color: white; padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-sm);
    font-family: var(--font-head); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
}
.header-nav { display: flex; gap: var(--space-lg); }
.header-nav a { color: var(--gray-600); font-weight: 600; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.5px; }

/* Hero */
.hero-section {
    margin-top: var(--header-height);
    background: linear-gradient(135deg, var(--sf-headers-dark) 0%, var(--sf-headers) 100%);
    padding: var(--space-3xl) 0; color: white;
}
.hero-container {
    max-width: 1200px; margin: 0 auto; padding: 0 var(--space-xl);
    display: grid; grid-template-columns: 1.3fr 1fr; gap: var(--space-3xl); align-items: center;
}
.industry-tag {
    display: inline-block; background: rgba(41,181,232,0.25); color: #bfe9f9;
    padding: var(--space-xs) var(--space-md); border-radius: var(--radius-full);
    font-size: 0.8rem; font-weight: 600; letter-spacing: 0.5px; margin-bottom: var(--space-md);
}
.hero-title { font-family: var(--font-head); font-size: 2.3rem; font-weight: 800; line-height: 1.25; margin-bottom: var(--space-md); text-transform: none; color: white; }
.hero-subtitle { font-family: var(--font-body); font-size: 1.05rem; color: #dceefa; margin-bottom: var(--space-xl); line-height: 1.7; text-transform: none; }
.hero-meta { display: flex; gap: var(--space-xl); margin-bottom: var(--space-xl); flex-wrap: wrap; }
.meta-item { display: flex; align-items: center; gap: var(--space-sm); color: #cfe6f2; font-size: 0.875rem; }
.meta-icon { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
.hero-cta {
    display: inline-flex; align-items: center; gap: var(--space-sm);
    background: var(--sf-accent); color: white; padding: var(--space-md) var(--space-xl);
    border-radius: var(--radius-md); font-family: var(--font-head); font-weight: 700; letter-spacing: 0.5px;
    box-shadow: var(--shadow-lg);
}
.hero-cta:hover { background: white; color: var(--sf-headers); }
.architecture-preview {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
    border-radius: var(--radius-lg); padding: var(--space-xl); backdrop-filter: blur(6px);
    font-family: var(--font-mono); font-size: 0.8rem; color: #cfe6f2; line-height: 1.9;
}
.arch-line { display: block; }
.arch-arrow { color: var(--sf-accent); }

/* Content sections */
.content-section { padding: var(--space-2xl) 0; }
.content-section.alt-bg { background: white; }
.section-container { max-width: 1200px; margin: 0 auto; padding: 0 var(--space-xl); }
.section-title {
    font-size: 1.5rem; font-weight: 800; color: var(--gray-900);
    margin-bottom: var(--space-xl); position: relative; padding-bottom: var(--space-md);
}
.section-title::after {
    content: ''; position: absolute; bottom: 0; left: 0; width: 56px; height: 4px;
    background: linear-gradient(90deg, var(--sf-accent), var(--sf-headers)); border-radius: var(--radius-full);
}

.overview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-lg); }
.overview-card { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: var(--space-xl); }
.overview-card.highlight { background: linear-gradient(135deg, #eaf7fd, white); border-color: var(--sf-accent); }
.overview-card h3 { font-size: 0.95rem; color: var(--gray-700); margin-bottom: var(--space-md); }
.overview-card p { text-transform: none; font-family: var(--font-body); color: var(--gray-600); }
.learning-list { list-style: none; }
.learning-list li { position: relative; padding-left: var(--space-lg); margin-bottom: var(--space-sm); color: var(--gray-600); text-transform: none; font-family: var(--font-body); }
.learning-list li::before { content: ''; position: absolute; left: 0; top: 8px; width: 8px; height: 8px; background: var(--sf-accent); border-radius: 50%; }
.tech-tags { display: flex; flex-wrap: wrap; gap: var(--space-sm); }
.tech-tag {
    display: inline-flex; align-items: center; background: var(--gray-100);
    padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-sm);
    font-size: 0.78rem; color: var(--gray-700); font-family: var(--font-mono); text-transform: none;
}

.prerequisites-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-lg); }
.prereq-card { background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: var(--radius-md); padding: var(--space-lg); display: flex; gap: var(--space-md); align-items: flex-start; }
.prereq-icon { width: 28px; height: 28px; flex-shrink: 0; color: var(--sf-accent); }
.prereq-info h4 { font-size: 0.9rem; color: var(--gray-800); margin-bottom: var(--space-xs); }
.prereq-info p { font-family: var(--font-body); font-size: 0.85rem; color: var(--gray-500); text-transform: none; }

/* Progress tracker */
.progress-tracker {
    position: fixed; left: 0; top: var(--header-height); bottom: 0; width: var(--sidebar-width);
    background: white; border-right: 1px solid var(--gray-200); padding: var(--space-xl); overflow-y: auto; z-index: 50;
}
.progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-md); font-family: var(--font-head); font-weight: 700; font-size: 0.8rem; color: var(--gray-700); }
.progress-percent { color: var(--sf-accent); }
.progress-bar { height: 6px; background: var(--gray-200); border-radius: var(--radius-full); margin-bottom: var(--space-xl); overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--sf-accent), var(--sf-green)); border-radius: var(--radius-full); width: 0%; transition: width 250ms ease; }
.steps-nav { display: flex; flex-direction: column; gap: var(--space-xs); }
.step-nav-item {
    display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-sm) var(--space-md);
    border-radius: var(--radius-md); color: var(--gray-600); font-size: 0.82rem; text-decoration: none;
}
.step-nav-item:hover { background: var(--gray-100); }
.step-nav-item.active { background: #eaf7fd; color: var(--sf-headers); font-weight: 700; }
.step-nav-item.completed { color: var(--sf-green); }
.step-nav-item .step-indicator {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid currentColor;
    display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; flex-shrink: 0;
}
.step-nav-item.completed .step-indicator { background: var(--sf-green); border-color: var(--sf-green); color: white; }

/* Steps container */
.steps-container { margin-left: var(--sidebar-width); padding: var(--space-2xl); max-width: calc(var(--content-max-width) + var(--sidebar-width) + var(--space-3xl) * 2); }

.callout { display: flex; gap: var(--space-md); padding: var(--space-lg); border-radius: var(--radius-md); margin: 0 0 var(--space-xl) 0; }
.callout-icon { flex-shrink: 0; width: 24px; height: 24px; }
.callout-icon svg { width: 100%; height: 100%; }
.callout-content { flex: 1; }
.callout-title { display: block; margin-bottom: var(--space-xs); font-family: var(--font-head); font-size: 0.85rem; letter-spacing: 0.5px; }
.callout-content p { margin: 0; font-size: 0.92rem; font-family: var(--font-body); text-transform: none; color: var(--gray-700); }
.callout-warning { background: #fff4e6; border-left: 4px solid var(--sf-orange); }
.callout-warning .callout-icon { color: var(--sf-orange); }
.callout-info { background: #eaf7fd; border-left: 4px solid var(--sf-accent); }
.callout-info .callout-icon { color: var(--sf-accent); }
.callout-tip { background: #eafaf3; border-left: 4px solid var(--sf-green); }
.callout-tip .callout-icon { color: var(--sf-green); }

.step-card { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius-lg); margin-bottom: var(--space-xl); overflow: hidden; scroll-margin-top: calc(var(--header-height) + var(--space-lg)); }
.step-card.completed { border-color: var(--sf-green); }
.step-card.completed .step-number { background: var(--sf-green); }
.step-header { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-lg); background: var(--gray-50); border-bottom: 1px solid var(--gray-200); cursor: pointer; }
.step-number {
    width: 40px; height: 40px; background: var(--sf-headers); color: white; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-family: var(--font-head); font-weight: 800; font-size: 1.05rem; flex-shrink: 0;
}
.step-info { flex: 1; }
.step-title { font-size: 1.05rem; font-weight: 800; color: var(--gray-800); margin: 0; text-transform: none; }
.step-duration { font-family: var(--font-body); font-size: 0.78rem; color: var(--gray-500); text-transform: none; }
.step-toggle { background: none; border: none; padding: var(--space-sm); cursor: pointer; color: var(--gray-400); transition: transform 150ms ease; }
.step-toggle[aria-expanded="false"] { transform: rotate(-90deg); }
.step-toggle svg { width: 22px; height: 22px; fill: currentColor; }
.step-content { padding: var(--space-xl); }
.step-content.collapsed { display: none; }
.step-description { color: var(--gray-600); margin-bottom: var(--space-lg); line-height: 1.75; text-transform: none; font-family: var(--font-body); }
.step-description strong { color: var(--gray-800); }
.step-description code { background: var(--gray-100); padding: 2px 6px; border-radius: var(--radius-sm); font-size: 0.85rem; }
.step-actions { display: flex; justify-content: flex-end; padding-top: var(--space-lg); border-top: 1px solid var(--gray-200); margin-top: var(--space-xl); }
.btn-check {
    display: inline-flex; align-items: center; gap: var(--space-sm); background: var(--gray-100); color: var(--gray-700);
    border: none; padding: var(--space-sm) var(--space-lg); border-radius: var(--radius-md); font-family: var(--font-head);
    font-weight: 700; font-size: 0.78rem; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer;
}
.btn-check:hover { background: var(--sf-green); color: white; }
.btn-check svg { width: 16px; height: 16px; fill: currentColor; }
.btn-check:disabled { cursor: default; }

.sub-heading { font-family: var(--font-head); font-size: 0.85rem; color: var(--sf-headers); letter-spacing: 0.5px; margin: var(--space-lg) 0 var(--space-sm) 0; }

/* Code blocks */
.code-block { background: var(--gray-900); border-radius: var(--radius-md); margin: var(--space-md) 0 var(--space-lg) 0; overflow: hidden; }
.code-header { display: flex; justify-content: space-between; align-items: center; padding: var(--space-sm) var(--space-md); background: var(--gray-800); border-bottom: 1px solid var(--gray-700); }
.code-language { color: var(--gray-400); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; font-family: var(--font-head); }
.code-actions { display: flex; gap: var(--space-xs); }
.code-actions button { background: transparent; border: none; padding: var(--space-xs) var(--space-sm); cursor: pointer; color: var(--gray-400); border-radius: var(--radius-sm); font-family: var(--font-head); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.5px; }
.code-actions button:hover { background: var(--gray-700); color: var(--sf-accent); }
.code-block pre { margin: 0; padding: var(--space-lg); overflow-x: auto; max-height: 480px; }
.code-block code { font-family: var(--font-mono); font-size: 0.82rem; line-height: 1.6; color: var(--gray-100); white-space: pre; }

/* Tables */
.table-wrapper { overflow-x: auto; margin: var(--space-lg) 0; border-radius: var(--radius-md); border: 1px solid var(--gray-200); }
.data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
.data-table th { background: var(--gray-100); padding: var(--space-sm) var(--space-md); text-align: left; font-family: var(--font-head); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.5px; text-transform: uppercase; color: var(--gray-700); border-bottom: 2px solid var(--gray-300); white-space: nowrap; }
.data-table td { padding: var(--space-sm) var(--space-md); border-bottom: 1px solid var(--gray-200); color: var(--gray-600); }
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table code { background: var(--gray-100); padding: 2px 6px; border-radius: var(--radius-sm); font-size: 0.78rem; }

/* Completion */
.completion-section { display: none; background: linear-gradient(135deg, var(--sf-green), #1f8a5f); color: white; padding: var(--space-3xl) 0; text-align: center; margin-left: var(--sidebar-width); }
.completion-section.visible { display: block; }
.completion-container { max-width: 600px; margin: 0 auto; padding: 0 var(--space-xl); }
.completion-icon { width: 72px; height: 72px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-xl); }
.completion-icon svg { width: 42px; height: 42px; fill: var(--sf-green); }
.completion-section h2 { font-size: 1.7rem; margin-bottom: var(--space-md); color: white; }
.completion-section p { text-transform: none; font-family: var(--font-body); }
.completion-summary { display: flex; justify-content: center; gap: var(--space-2xl); margin: var(--space-xl) 0; }
.summary-item { text-align: center; }
.summary-label { display: block; font-size: 0.8rem; opacity: 0.9; margin-bottom: var(--space-xs); text-transform: none; font-family: var(--font-body); }
.summary-value { font-family: var(--font-head); font-size: 1.4rem; font-weight: 800; }
.next-actions { background: rgba(255,255,255,0.12); border-radius: var(--radius-lg); padding: var(--space-xl); margin-top: var(--space-xl); text-align: left; }
.next-actions h3 { font-size: 0.9rem; margin-bottom: var(--space-md); }
.next-actions ul { list-style: none; text-transform: none; font-family: var(--font-body); }
.next-actions li { padding: var(--space-xs) 0; }

/* Footer */
.hol-footer { background: var(--gray-900); color: var(--gray-400); padding: var(--space-xl) 0; margin-left: var(--sidebar-width); }
.footer-container { max-width: 1200px; margin: 0 auto; padding: 0 var(--space-xl); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-md); }
.footer-brand { display: flex; align-items: center; gap: var(--space-md); }
.footer-brand .sf-logo-mark { filter: brightness(0) invert(1); }
.footer-meta { text-align: right; font-size: 0.78rem; }

@media (max-width: 992px) {
    .progress-tracker { display: none; }
    .steps-container, .hol-footer, .completion-section { margin-left: 0; }
    .hero-container, .overview-grid, .prerequisites-grid { grid-template-columns: 1fr; }
    .header-nav { display: none; }
}


/* ============================================================
   EXTENSIONES SEMANTICAS DEL HOL
   Traduce el vocabulario del HOL real (paso-criterio, modalidad-badge,
   bug-real, wow, evidencia, prompt de CoCo, ubicate, arquitectura)
   al lenguaje visual del skill (paleta #29B5E8 / #11567F).
   ============================================================ */

/* --- Criterio de exito por paso (franja verde) --- */
.step-criterio {
    display: flex;
    align-items: flex-start;
    gap: var(--space-sm);
    background: rgba(47,179,128,0.08);
    border-left: 3px solid var(--sf-green);
    border-radius: var(--radius-sm);
    padding: var(--space-sm) var(--space-md);
    margin: var(--space-md) 0;
    font-size: 0.9375rem;
    color: var(--gray-700);
}
.step-criterio strong { color: #1c7a56; }
.step-criterio.hard {
    background: rgba(229,72,77,0.07);
    border-left-color: var(--sf-red);
}
.step-criterio.hard strong { color: #b3282c; }

/* --- Badge de modalidad de ejecucion (SQL / Snowsight / CoCo / CLI) --- */
.modalidad-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-head);
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 4px 12px;
    border-radius: var(--radius-full);
    margin-bottom: var(--space-sm);
}
.modalidad-badge.sql   { background: rgba(41,181,232,0.14); color: #14708f; border: 1px solid rgba(41,181,232,0.35); }
.modalidad-badge.ui    { background: rgba(17,86,127,0.10);  color: var(--sf-headers); border: 1px solid rgba(17,86,127,0.28); }
.modalidad-badge.coco  { background: rgba(139,92,246,0.12); color: #6d3fd4; border: 1px solid rgba(139,92,246,0.32); }
.modalidad-badge.cli   { background: rgba(100,116,139,0.12); color: var(--gray-600); border: 1px solid rgba(100,116,139,0.30); }

/* --- Bug real encontrado en la validacion (borde rojo punteado) --- */
.bug-real {
    border: 2px dashed var(--sf-red);
    border-radius: var(--radius-md);
    background: rgba(229,72,77,0.04);
    padding: var(--space-lg);
    margin: var(--space-lg) 0;
}
.bug-titulo {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 0.9375rem;
    color: #b3282c;
    margin-bottom: var(--space-sm);
    display: flex;
    align-items: center;
    gap: var(--space-sm);
}
.bug-real p { margin-bottom: var(--space-sm); font-size: 0.9375rem; }
.bug-real p:last-child { margin-bottom: 0; }

/* --- Momento WOW: construye algo que impresiona (borde morado) --- */
.wow {
    border: 2px solid #8b5cf6;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, rgba(139,92,246,0.06) 0%, rgba(41,181,232,0.05) 100%);
    padding: var(--space-lg);
    margin: var(--space-lg) 0;
}
.wow-titulo {
    font-family: var(--font-head);
    font-weight: 800;
    font-size: 1rem;
    color: #6d3fd4;
    margin-bottom: var(--space-sm);
    display: flex;
    align-items: center;
    gap: var(--space-sm);
}
.wow p { margin-bottom: var(--space-sm); font-size: 0.9375rem; }
.wow p:last-child { margin-bottom: 0; }

/* --- Evidencia verificada (borde verde punteado) --- */
.evidencia {
    border: 1px dashed var(--sf-green);
    border-radius: var(--radius-md);
    background: rgba(47,179,128,0.05);
    padding: var(--space-md) var(--space-lg);
    margin: var(--space-lg) 0;
    font-size: 0.9rem;
    color: var(--gray-700);
}
.evidencia code { background: rgba(47,179,128,0.12); color: #1c7a56; }

/* --- Prompt para CoCo (estilo burbuja de chat) --- */
.prompt-label {
    font-family: var(--font-head);
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #6d3fd4;
    margin: var(--space-md) 0 var(--space-xs);
}
.prompt-coco {
    position: relative;
    background: #f5f3ff;
    border: 1px solid rgba(139,92,246,0.30);
    border-left: 4px solid #8b5cf6;
    border-radius: var(--radius-md);
    padding: var(--space-md) var(--space-lg);
    margin-bottom: var(--space-md);
    font-family: var(--font-body);
    font-size: 0.9375rem;
    font-style: italic;
    color: var(--gray-800);
    line-height: 1.65;
}

/* --- "Ubicate": donde pararse antes de ejecutar el paso --- */
.ubicate {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 0.8125rem;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--sf-headers);
    background: rgba(41,181,232,0.10);
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    margin-right: 6px;
}

/* --- Detalle colapsable: "ver el SQL que corre por debajo" --- */
details.underlying {
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-md);
    background: var(--gray-50);
    padding: var(--space-sm) var(--space-md);
    margin: var(--space-md) 0;
}
details.underlying > summary {
    cursor: pointer;
    font-family: var(--font-head);
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--sf-headers);
    list-style: none;
}
details.underlying > summary::before { content: '▸ '; color: var(--sf-accent); }
details.underlying[open] > summary::before { content: '▾ '; }
details.underlying[open] > summary { margin-bottom: var(--space-md); }

/* --- Diagrama de arquitectura en texto (sin dependencias externas) --- */
.arch-diagram {
    background: var(--gray-900);
    color: #cbd5e1;
    border-radius: var(--radius-md);
    padding: var(--space-lg);
    margin: var(--space-lg) 0;
    font-family: var(--font-mono);
    font-size: 0.8125rem;
    line-height: 1.5;
    overflow-x: auto;
    white-space: pre;
}
.arch-diagram .n { color: var(--sf-accent); font-weight: 700; }
.arch-diagram .g { color: var(--sf-green); }

/* --- Badges de estado de track (PASA / conectas-no-construyes) --- */
.track-badge {
    display: inline-block;
    font-family: var(--font-head);
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 3px 10px;
    border-radius: var(--radius-full);
    margin-left: var(--space-sm);
    vertical-align: middle;
}
.track-badge.pasa    { background: rgba(47,179,128,0.15); color: #1c7a56; }
.track-badge.connect { background: rgba(41,181,232,0.15); color: #14708f; }
.track-badge.excep   { background: rgba(255,146,43,0.15); color: #b35f00; }

/* Sobre fondo oscuro (hero) los badges necesitan fondo solido para tener contraste */
.hero-section .track-badge.pasa,
.hero-section .track-badge.connect,
.hero-section .track-badge.excep {
    background: rgba(255,255,255,0.92);
    box-shadow: 0 1px 4px rgba(0,0,0,0.18);
}

/* --- Rol del proveedor (nota de gobernanza del Anexo 11) --- */
.rol-proveedor {
    font-size: 0.8125rem;
    color: var(--gray-500);
    font-style: italic;
}

</style>

<script>

const HOLState = {
    totalSteps: 0,
    completedSteps: new Set(),
    startTime: null,
    currentStep: 1
};

document.addEventListener('DOMContentLoaded', function() {
    initializeHOL();
});

function initializeHOL() {
    HOLState.totalSteps = document.querySelectorAll('.step-card').length;
    HOLState.startTime = new Date();
    loadProgress();
    initStepToggles();
    initScrollSpy();
    initKeyboardShortcuts();
    updateProgressUI();
}

function markStepComplete(stepNumber) {
    HOLState.completedSteps.add(stepNumber);

    const stepCard = document.getElementById(`step-${stepNumber}`);
    if (stepCard) {
        stepCard.classList.add('completed');
        const btn = stepCard.querySelector('.btn-check');
        if (btn) {
            btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg> Completado`;
            btn.disabled = true;
            btn.style.background = 'var(--sf-green)';
            btn.style.color = 'white';
        }
    }

    const navItem = document.querySelector(`.step-nav-item[data-step="${stepNumber}"]`);
    if (navItem) { navItem.classList.add('completed'); }

    saveProgress();
    updateProgressUI();

    if (HOLState.completedSteps.size === HOLState.totalSteps) {
        showCompletion();
    } else if (stepNumber < HOLState.totalSteps) {
        setTimeout(() => { scrollToStep(stepNumber + 1); }, 500);
    }
}

function updateProgressUI() {
    const progress = (HOLState.completedSteps.size / HOLState.totalSteps) * 100;
    const progressFill = document.getElementById('progressFill');
    if (progressFill) { progressFill.style.width = `${progress}%`; }
    const progressPercent = document.querySelector('.progress-percent');
    if (progressPercent) { progressPercent.textContent = `${Math.round(progress)}%`; }
}

function saveProgress() {
    const holId = document.body.dataset.holId || 'default-hol';
    const data = {
        completedSteps: Array.from(HOLState.completedSteps),
        startTime: HOLState.startTime.toISOString(),
        lastUpdated: new Date().toISOString()
    };
    localStorage.setItem(`hol-progress-${holId}`, JSON.stringify(data));
}

function loadProgress() {
    const holId = document.body.dataset.holId || 'default-hol';
    const saved = localStorage.getItem(`hol-progress-${holId}`);
    if (saved) {
        try {
            const data = JSON.parse(saved);
            data.completedSteps.forEach(step => {
                HOLState.completedSteps.add(step);
                const stepCard = document.getElementById(`step-${step}`);
                if (stepCard) { stepCard.classList.add('completed'); }
                const navItem = document.querySelector(`.step-nav-item[data-step="${step}"]`);
                if (navItem) { navItem.classList.add('completed'); }
            });
            if (data.startTime) { HOLState.startTime = new Date(data.startTime); }
        } catch (e) { console.error('Error loading progress:', e); }
    }
}

function initStepToggles() {
    document.querySelectorAll('.step-toggle').forEach(toggle => {
        toggle.addEventListener('click', function(e) {
            e.stopPropagation();
            const stepCard = this.closest('.step-card');
            const content = stepCard.querySelector('.step-content');
            const isExpanded = this.getAttribute('aria-expanded') === 'true';
            this.setAttribute('aria-expanded', !isExpanded);
            content.classList.toggle('collapsed', isExpanded);
        });
    });
    document.querySelectorAll('.step-header').forEach(header => {
        header.addEventListener('click', function() {
            const toggle = this.querySelector('.step-toggle');
            if (toggle) { toggle.click(); }
        });
    });
}

function copyCode(button) {
    const codeBlock = button.closest('.code-block');
    const code = codeBlock.querySelector('code');
    const text = code.textContent;

    navigator.clipboard.writeText(text).then(() => {
        const originalText = button.textContent;
        button.textContent = 'Copiado ✓';
        setTimeout(() => { button.textContent = originalText; }, 2000);
    }).catch(err => {
        console.error('Error copying:', err);
        alert('Error al copiar el código');
    });
}

function initScrollSpy() {
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const stepNumber = entry.target.dataset.step;
                updateActiveNavItem(stepNumber);
                HOLState.currentStep = parseInt(stepNumber);
            }
        });
    }, { rootMargin: '-100px 0px -50% 0px' });

    document.querySelectorAll('.step-card').forEach(card => { observer.observe(card); });
}

function updateActiveNavItem(stepNumber) {
    document.querySelectorAll('.step-nav-item').forEach(item => { item.classList.remove('active'); });
    const activeItem = document.querySelector(`.step-nav-item[data-step="${stepNumber}"]`);
    if (activeItem) { activeItem.classList.add('active'); }
}

function scrollToStep(stepNumber) {
    const stepCard = document.getElementById(`step-${stepNumber}`);
    if (stepCard) { stepCard.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
}

function initKeyboardShortcuts() {
    document.addEventListener('keydown', function(e) {
        if (e.altKey && e.key >= '1' && e.key <= '9') {
            const stepNumber = parseInt(e.key);
            if (stepNumber <= HOLState.totalSteps) { scrollToStep(stepNumber); e.preventDefault(); }
        }
        if (e.altKey && e.key === 'c') {
            if (!HOLState.completedSteps.has(HOLState.currentStep)) { markStepComplete(HOLState.currentStep); }
            e.preventDefault();
        }
        if (e.altKey && e.key === 'n') {
            if (HOLState.currentStep < HOLState.totalSteps) { scrollToStep(HOLState.currentStep + 1); }
            e.preventDefault();
        }
        if (e.altKey && e.key === 'p') {
            if (HOLState.currentStep > 1) { scrollToStep(HOLState.currentStep - 1); }
            e.preventDefault();
        }
    });
}

function showCompletion() {
    const completionSection = document.getElementById('completionSection');
    if (completionSection) {
        completionSection.classList.add('visible');
        completionSection.scrollIntoView({ behavior: 'smooth' });
        const endTime = new Date();
        const duration = endTime - HOLState.startTime;
        const minutes = Math.floor(duration / 60000);
        const seconds = Math.floor((duration % 60000) / 1000);
        const totalTimeEl = document.getElementById('totalTime');
        if (totalTimeEl) { totalTimeEl.textContent = `${minutes}m ${seconds}s`; }
    }
}

</script>
